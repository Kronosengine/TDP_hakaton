<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИИ Помощник Елена - КосГос</title>
    <link rel="icon" href="images/favicon.jfif" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #f4f7fb;
            --card: #ffffff;
            --text: #1e293b;
            --border: #dbe3ee;
            --accent: #2563eb;
            --footer: #1e1e1e;
        }

        body.dark {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --border: #334155;
            --accent: #3b82f6;
        }

        body {
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== HERO ===== */
        .hero {
            position: relative;
            background-image: url("images/kgu.jpg");
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
        }
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, .55);
        }

        /* ===== HEADER ===== */
        .header {
            position: relative;
            z-index: 10;
            max-width: 800px;
            margin: 0 auto;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,.2);
            background: rgba(255,255,255,.1);
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            text-decoration: none;
            transition: all 0.2s;
        }
        .back-btn:hover {
            background: rgba(255,255,255,.2);
        }
        .back-btn svg {
            width: 20px;
            height: 20px;
        }
        .header-title {
            color: white;
            font-size: 18px;
            font-weight: 600;
        }
        .theme-switch {
            width: 64px;
            min-width: 64px;
            height: 32px;
            border-radius: 30px;
            position: relative;
            cursor: pointer;
            border: 2px solid #fff;
            background: rgba(255, 255, 255, .12);
            flex-shrink: 0;
        }
        .theme-switch input { display: none; }
        .switch-ball {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #fff;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: .2s;
        }
        #theme-toggle:checked + .switch-ball { transform: translateX(32px); }
        .sun-icon, .moon-icon {
            width: 16px;
            height: 16px;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            stroke-width: 2;
            fill: none;
        }
        .sun-icon { left: 7px; stroke: gold; }
        .moon-icon { right: 7px; stroke: silver; }

        /* ===== ЧАТ ===== */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .welcome-block {
            text-align: center;
            color: var(--text);
            opacity: 0.7;
            padding: 40px 20px;
        }
        .welcome-block .avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
            color: white;
        }
        .welcome-block h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }
        .welcome-block p {
            font-size: 13px;
            margin-bottom: 4px;
        }
        .welcome-block .topics {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
        }
        .welcome-block .topic-chip {
            padding: 8px 14px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text);
        }
        .welcome-block .topic-chip:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 85%;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message-user {
            align-self: flex-end;
        }
        .message-bot {
            align-self: flex-start;
        }
        .message-content {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .message-user .message-content {
            background: var(--accent);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message-bot .message-content {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }
        .message-sender {
            font-size: 11px;
            opacity: 0.6;
            margin-bottom: 4px;
            padding: 0 4px;
        }
        .typing-indicator {
            align-self: flex-start;
            padding: 12px 20px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            font-size: 13px;
            opacity: 0.7;
        }

        /* Ввод */
        .chat-input-wrapper {
            display: flex;
            padding: 12px 16px;
            background: var(--card);
            border-top: 1px solid var(--border);
            gap: 10px;
        }
        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            background: var(--bg);
            color: var(--text);
            transition: border-color 0.2s;
        }
        .chat-input:focus {
            border-color: var(--accent);
        }
        .send-button {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.2s;
        }
        .send-button:hover {
            background: #1d4ed8;
        }
        .send-button svg {
            width: 20px;
            height: 20px;
        }

        /* ===== FOOTER ===== */
        .footer {
            background: var(--footer);
            padding: 12px;
            text-align: center;
            color: rgba(255,255,255,.6);
            font-size: 11px;
            flex-shrink: 0;
        }

        /* Адаптив */
        @media (max-width: 480px) {
            .header {
                padding: 10px 14px;
            }
            .header-title {
                font-size: 16px;
            }
            .chat-messages {
                padding: 14px;
            }
            .message-content {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <!-- HERO -->
    <section class="hero">
        <div class="overlay"></div>
        <header class="header">
            <div class="header-left">
                <a href="#" class="back-btn" id="backBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"/>
                    </svg>
                </a>
                <span class="header-title">ИИ Помощник Елена</span>
            </div>
            <label class="theme-switch" title="Сменить тему">
                <input type="checkbox" id="theme-toggle" onchange="toggleTheme()">
                <div class="switch-ball"></div>
                <svg class="sun-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                <svg class="moon-icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </label>
        </header>
    </section>

    <!-- ЧАТ -->
    <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
            <div class="welcome-block">
                <div class="avatar">Е</div>
                <h2>ИИ Помощник Елена</h2>
                <p>Здравствуйте! Я помогу вам найти информацию.</p>
                <p>Задайте вопрос на любую тему:</p>
                <div class="topics">
                    <span class="topic-chip" onclick="sendTopic('Какие есть стипендии?')">💰 Стипендии</span>
                    <span class="topic-chip" onclick="sendTopic('Расскажи о военной кафедре')">🎖️ Военная кафедра</span>
                    <span class="topic-chip" onclick="sendTopic('Какие есть новости?')">📰 Новости</span>
                    <span class="topic-chip" onclick="sendTopic('Какие есть образовательные программы?')">📚 Программы</span>
                </div>
            </div>
        </div>

        <div class="chat-input-wrapper">
            <input 
                type="text" 
                class="chat-input" 
                id="userInput" 
                placeholder="Введите ваш вопрос..."
                onkeypress="handleKeyPress(event)"
            />
            <button class="send-button" onclick="sendMessage()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="m22 2-10 20-4-8-8-4Z"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
        <span>© 2026 КосГос. Все права защищены. | Официальный сайт: kosgos.ru</span>
    </footer>

    <script>
        // ===== ДИНАМИЧЕСКИЙ ВОЗВРАТ НА ПРЕДЫДУЩУЮ СТРАНИЦУ =====
        const backBtn = document.getElementById('backBtn');
        
        // Проверяем, откуда пришли (через document.referrer или localStorage)
        const previousPage = localStorage.getItem('previousPage');
        
        if (previousPage && previousPage !== 'bot.html') {
            backBtn.href = previousPage;
        } else {
            // Если нет сохранённой страницы, проверяем referrer
            const referrer = document.referrer;
            if (referrer && referrer.includes(window.location.hostname)) {
                backBtn.href = referrer;
            } else {
                // По умолчанию - главная
                backBtn.href = 'main.html';
            }
        }

        // ===== КОНФИГУРАЦИЯ =====
        const API_URL = 'http://85.239.37.235:5500';
        let chatHistory = [];

        // ===== ТЕМА =====
        function toggleTheme() {
            document.body.classList.toggle('dark');
            localStorage.setItem('theme', document.body.classList.contains('dark') ? 'dark' : 'light');
        }
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark');
            document.getElementById('theme-toggle').checked = true;
        }

        // ===== БЫСТРЫЕ ТЕМЫ =====
        function sendTopic(text) {
            document.getElementById('userInput').value = text;
            sendMessage();
        }

        // ===== ОТПРАВКА СООБЩЕНИЯ =====
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            addMessage('user', message);
            input.value = '';

            const typingId = showTyping();

            try {
                const response = await fetch(`${API_URL}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: message,
                        history: chatHistory.slice(-10)
                    })
                });

                const data = await response.json();
                removeTyping(typingId);

                if (response.ok) {
                    addMessage('bot', data.answer);
                    chatHistory.push(
                        { role: 'user', content: message },
                        { role: 'assistant', content: data.answer }
                    );
                } else {
                    addMessage('bot', '❌ ' + (data.error || 'Ошибка. Попробуйте позже.'));
                }

            } catch (error) {
                removeTyping(typingId);
                addMessage('bot', '❌ Не удалось подключиться к серверу.');
            }
        }

        function addMessage(type, text) {
            const container = document.getElementById('chatMessages');
            const welcome = container.querySelector('.welcome-block');
            if (welcome) welcome.remove();

            const div = document.createElement('div');
            div.className = `message message-${type}`;
            div.innerHTML = `
                <div class="message-sender">${type === 'user' ? 'Вы' : 'Елена'}</div>
                <div class="message-content">${formatMessage(text)}</div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function showTyping() {
            const container = document.getElementById('chatMessages');
            const id = 'typing_' + Date.now();
            const div = document.createElement('div');
            div.id = id;
            div.className = 'typing-indicator';
            div.textContent = 'Елена печатает...';
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return id;
        }

        function removeTyping(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function formatMessage(text) {
            let formatted = text.replace(/\n/g, '<br>');
            formatted = formatted.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" style="color:#2563eb;">$1</a>');
            formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            return formatted;
        }
    </script>

</body>
</html>
