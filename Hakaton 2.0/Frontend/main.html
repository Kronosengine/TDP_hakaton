<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>ЭИОС КГУ</title>
    <link rel="stylesheet" href="style/main.css">
    <link rel="icon" href="images/favicon.jfif" type="image/x-icon">
</head>
<body>
    <header class="hero">
        <div class="overlay"></div>
        <input type="checkbox" id="menu-toggle">
        <div class="header">
            <div class="left-header">
                <label for="menu-toggle" class="burger">
                    <span></span><span></span><span></span>
                </label>
                <a href="main.html" class="logo"><img src="images/kgu_logo.jpg" alt="Логотип"></a>
            </div>
            <div class="search">
                <input type="text" placeholder="Поиск...">
                <button><svg viewBox="0 0 24 24" fill="none">
                        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" />
                        <path d="M20 20L17 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg></button>
            </div>
            <label class="theme-switch">
                <input type="checkbox" id="theme-toggle">
                <span class="switch-ball"></span>
                <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round">

                    <circle cx="12" cy="12" r="5"></circle>

                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>

                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>

                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>

                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>

                </svg>
                <svg class="moon-icon" viewBox="0 0 24 24">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                </svg>
            </label>
        </div>
        <nav class="mobile-menu">
            <a href="main.html">Главная</a>
            <a href="#">Направления</a>
            <a href="grants.html">Стипендия</a>
            <a href="#">Контакты</a>
        </nav>
    </header>
    <main class="container">
        <aside class="sidebar">
            <div class="filters-card">
                <h3>Фильтры</h3>
                <div class="filter-group">
                    <label>Специальности</label>
                    <label><input type="checkbox">Информатика</label>
                    <label><input type="checkbox">Экономика</label>
                    <label><input type="checkbox">Юриспруденция</label>
                    <label><input type="checkbox">Дизайн</label>
                </div>
                <div class="filter-group">
                    <label>Баллы</label>
                    <input type="range" min="0" max="400" value="180">
                </div>
                <div class="filter-group">
                    <label>Форма</label>
                    <select>
                        <option>Любая</option>
                        <option>Очная</option>
                        <option>Заочная</option>
                    </select>
                </div>
                <button class="apply-btn">Применить</button>
            </div>
        </aside>
        <section class="content">
            <div class="calculator">
                <h2>ЕГЭ</h2>
                <div class="subject-row"><select>
                        <option>Предмет</option>
                    </select><input type="number"></div>
                <div class="subject-row"><select>
                        <option>Предмет</option>
                    </select><input type="number"></div>
                <div class="subject-row"><select>
                        <option>Предмет</option>
                    </select><input type="number"></div>
                <button class="calculate-btn">Рассчитать</button>
                <div class="result">Результат</div>
            </div>
        </section>
    </main>
    <footer class="footer">
        <div class="footer-container">
            <div class="footer-column">
                <h4 class="footer-title">Мы в соцсетях</h4>
                <div class="social-links">
                    <a href="https://vk.com/kostroma_university" target="_blank" class="social-link">
                        <img src="images/vk.webp" alt="VK" class="social-icon">
                        ВКонтакте
                    </a>
                    <a href="https://t.me/KGU_Kostroma" target="_blank" class="social-link">
                        <img src="images/tg.png" alt="Telegram" class="social-icon">
                        Telegram
                    </a>
                    <a href="https://max.ru/kostroma_university" target="_blank" class="social-link">
                        <img src="images/Max_logo_2025.png" alt="Max" class="social-icon">
                        Max
                    </a>
                </div>
            </div>
            <div class="footer-column">
                <h4 class="footer-title">Поддержка</h4>
                <div class="support-links">
                    <a href="#" class="support-link">Помощь</a>
                    <a href="#" class="support-link">Частые вопросы</a>
                    <a href="#" class="support-link">Пользовательское соглашение</a>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            <p class="footer-text">© 2026 ИИнтелектуалы</p>
        </div>
    </footer>
    <script src="JS/night-theme.js"></script>
</body>

</html>
